name: Attendance-wuye CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# 全局环境变量设置
env:
  PNPM_VERSION: "10"
  NODE_VERSION: "23"

defaults:
  run:
    # necessary for windows
    shell: bash

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.OS }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-latest
            GUI_TARGET: x86_64-unknown-linux-gnu
            ARTIFACT_NAME: linux-x86_64

          - TARGET: aarch64-apple-darwin
            OS: macos-latest
            GUI_TARGET: aarch64-apple-darwin
            ARTIFACT_NAME: macos-aarch64

          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            GUI_TARGET: x86_64-pc-windows-msvc
            ARTIFACT_NAME: windows-x86_64
            WIN_RUSTFLAGS: "-C target-feature=+crt-static"

    name: Build for ${{ matrix.OS }}
    env:
      NAME: attendance-wuye
      TARGET: ${{ matrix.TARGET }}
      OS: ${{ matrix.OS }}
      GUI_TARGET: ${{ matrix.GUI_TARGET }}
      ARTIFACT_NAME: ${{ matrix.ARTIFACT_NAME }}
    steps:
      - name: Install GUI dependencies (x86 only)
        if: ${{ matrix.OS == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install -qq libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libgtk-3-dev \
              librsvg2-dev \
              libxdo-dev \
              libssl-dev \
              patchelf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set current ref as env variable
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> $GITHUB_ENV

      # 配置 Rust 缓存
      - name: Restore Rust dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 安装 Node
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "PNPM_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # 配置 pnpm 缓存
      - name: Restore pnpm dependencies cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.PNPM_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 安装前端依赖并构建前端产物（tauri.conf.json 中不再配置 beforeBuildCommand，
      # 避免打包工具在非交互环境下调用 pnpm 失败）
      - name: Install frontend dependencies
        run: |
          pnpm install

      - name: Build frontend
        run: |
          pnpm build

      # 设置 Rust 环境
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Rust 单元测试（报表规则）
      - name: Run Rust tests
        working-directory: ./src-tauri
        run: cargo test --verbose

      # 安装 Tauri CLI
      - name: Install Tauri CLI
        run: pnpm add -g @tauri-apps/cli

      # Windows 的 git-bash 环境没有自带 zip，装一个用于生成发布压缩包
      - name: Install zip (Windows)
        if: ${{ matrix.OS == 'windows-latest' }}
        run: choco install zip -y --no-progress

      # Windows 安装包（NSIS）会自动处理 WebView2 运行时依赖，
      # 因此 Windows 不再用 --no-bundle 只出裸 exe
      - name: Build GUI
        uses: tauri-apps/tauri-action@v0
        env:
          # 仅 Windows 生效：把 MSVC 运行库静态链接进主程序（等价于 /MT），
          # 这样目标机器不再需要安装 VC++ 运行库
          RUSTFLAGS: ${{ matrix.WIN_RUSTFLAGS }}
        with:
          projectPath: ./src-tauri
          args: --verbose --target ${{ matrix.GUI_TARGET }}

      # 各平台在自己的 runner 上生成发布压缩包：
      # - macOS 用 ditto，保留 .app 内部符号链接与扩展属性（zip 会导致签名失效）
      # - Windows 只交付单文件安装包（内置 WebView2 运行时）
      - name: Package release artifacts
        run: |
          set -e
          rm -rf dist
          mkdir -p dist

          if [[ $OS =~ ^windows.*$ ]]; then
              # 安装器已内置 WebView2 运行时，Windows 只发这一个 setup.exe
              setup="$(find src-tauri/target/$GUI_TARGET/release/bundle/nsis -name '*setup.exe' | head -1)"
              if [[ -z "$setup" ]]; then
                  echo "错误：未找到 NSIS 安装包"
                  find src-tauri/target/$GUI_TARGET/release -maxdepth 3 -name '*.exe' | head -20 || true
                  exit 1
              fi
              cp "$setup" "Attendance-wuye-$ARTIFACT_NAME-setup.exe"
          elif [[ $OS =~ ^macos.*$ ]]; then
              APP="$(ls -d src-tauri/target/$GUI_TARGET/release/bundle/macos/*.app | head -1)"
              # 没有开发者证书时，Tauri 只会保留链接器生成的临时 ad-hoc 签名，
              # 用户下载后 macOS 会判定签名不完整并提示“已损坏”；
              # 这里用标准 codesign 重新做一次完整的 ad-hoc 签名。
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict --verbose=2 "$APP"
              ditto -c -k --sequesterRsrc --keepParent "$APP" "Attendance-wuye-$ARTIFACT_NAME.zip"
          else
              cp src-tauri/target/$GUI_TARGET/release/bundle/deb/*.deb dist/
              (cd dist && zip -r "../Attendance-wuye-$ARTIFACT_NAME.zip" .)
          fi

          # 注意：baobiao.json 属于各单位真实人员数据，不随仓库与发布包分发
          echo "=== 产物 ==="
          ls -la Attendance-wuye-*

      # 校验产物存在（Windows 只有安装包，其它平台只有压缩包）
      - name: Verify outputs
        run: |
          set -e
          ls -la Attendance-wuye-*
          count=$(ls -1 Attendance-wuye-* 2>/dev/null | wc -l | tr -d ' ')
          echo "产物数量: $count"
          [[ "$count" -ge 1 ]]

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-wuye-${{ matrix.ARTIFACT_NAME }}
          path: |
            Attendance-wuye-*.zip
            Attendance-wuye-*-setup.exe
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release packages
        run: |
          echo "下载的文件结构:"
          ls -R artifacts
          echo "文件总数: $(find artifacts -type f | wc -l)"

          # 各平台已经在自己的 runner 上生成好压缩包（macOS 用 ditto 以保留 .app 签名），
          # 这里只做收集与重命名，不再二次压缩（zip/chmod 会破坏 .app 的签名）
          mkdir -p ./artifacts_done
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            found=0
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              cp "$file" "./artifacts_done/${name}.zip"
              found=1
              break
            done < <(find "$dir" -name '*.zip' | sort)
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              cp "$file" "./artifacts_done/${name}-setup.exe"
              found=1
              break
            done < <(find "$dir" -name '*-setup.exe' | sort)
            if [[ "$found" -eq 0 ]]; then
              echo "警告：$name 中没有找到发布文件"
            fi
          done
          echo "最终发布文件:"
          ls -la ./artifacts_done

      - name: Set Release tag
        id: set_tag
        run: echo "RELEASE_TAG=v$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            ./artifacts_done/**/*
